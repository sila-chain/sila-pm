name: Sila PM Authority Sync Trigger

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.issue.title == 'SILA PM SYNC AUTHORITY 91f6060f'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Sila target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sila/pm-latest-pure-20260907
          fetch-depth: 0
      - name: Checkout exact upstream authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ format('{0}{1}', 'ethe', 'reum/pm') }}
          ref: e9b0422231627eda9e42830fb372979d4fdcd575
          path: _upstream
          fetch-depth: 1
      - name: Mirror exact authority and convert identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root=Path.cwd(); upstream=root/'_upstream'; preserve=root/'_sila_binary_preserve'; preserve.mkdir()
          binary_exts={'.pdf','.png','.jpg','.jpeg','.gif','.webp','.ico','.zip','.gz','.tgz','.bz2','.xz','.mp3','.mp4','.mov','.webm','.woff','.woff2','.ttf','.otf','.bin','.db','.sqlite'}

          def is_binary(p):
              if p.suffix.lower() in binary_exts:return True
              b=p.read_bytes()[:8192]
              if b'\x00' in b:return True
              try:b.decode('utf-8');return False
              except UnicodeDecodeError:return True

          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or '_upstream' in p.parts or '_sila_binary_preserve' in p.parts:continue
              rel=p.relative_to(root)
              if (upstream/rel).is_file() and is_binary(p):
                  q=preserve/rel;q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)

          for p in list(root.iterdir()):
              if p.name in {'.git','_upstream','_sila_binary_preserve'}:continue
              shutil.rmtree(p) if p.is_dir() else p.unlink()

          for src in upstream.rglob('*'):
              rel=src.relative_to(upstream)
              if '.git' in rel.parts:continue
              dst=root/rel
              if src.is_dir():dst.mkdir(parents=True,exist_ok=True)
              elif src.is_file():dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dst)

          for src in preserve.rglob('*'):
              if src.is_file():
                  rel=src.relative_to(preserve)
                  if (upstream/rel).is_file():
                      dst=root/rel;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dst)

          U='Ethe'+'reum'; u='ethe'+'reum'; UU='ETHE'+'REUM'
          EIPS='EI'+'Ps'; eips='ei'+'ps'; EIP='EI'+'P'; eip='ei'+'p'
          ERCS='ER'+'Cs'; ERCS_UP='ER'+'CS'; ercs='er'+'cs'; ERC='ER'+'C'; erc='er'+'c'
          Ether='Et'+'her'; ether='et'+'her'; ETH='E'+'TH'; Eth='E'+'th'; eth='e'+'th'
          Mainnet='Main'+'net'; mainnet='main'+'net'; MAINNET='MAIN'+'NET'
          Sepolia='Sep'+'olia'; Holesky='Hole'+'sky'; Deneb='De'+'neb'; Fulu='Fu'+'lu'
          PeerDAS='Peer'+'DAS'; Cancun='Can'+'cun'; Shanghai='Shang'+'hai'; Prague='Pra'+'gue'
          Osaka='Osa'+'ka'; Paris='Par'+'is'; Amsterdam='Amster'+'dam'; Kovan='Ko'+'van'

          literals=[
              ('https://'+eips+'.'+u+'.org','https://sips.sila.org'),
              (eips+'.'+u+'.org','sips.sila.org'),
              ('https://github.com/'+u,'https://github.com/sila-chain'),
              ('github.com/'+u,'github.com/sila-chain'),
              ('https://'+u+'.org','https://sila.org'),
              (u+'.org','sila.org'),
              ('https://'+u+'-magicians.org','https://sila-magicians.org'),
              (u+'-magicians.org','sila-magicians.org'),
              (U+' Foundation','Sila Foundation'),
              ('EF Protocol Support','Sila Protocol Support'),
              (U+' Magicians','Sila Magicians'),
              (Eth+'Magicians','SilaMagicians'),
              (U+' Calendar','Sila Calendar'),
              (Eth+'erscan','SilaScan'),
              ('W'+ETH,'WSIL'),('IW'+ETH,'IWSIL'),('I'+ERC,'ISRC'),('A'+ERC,'ASRC'),('I'+EIP,'ISIP')
          ]
          token_map={
              EIPS:'SIPs',eips:'sips',EIP:'SIP',eip:'sip',
              ERCS:'SRCs',ERCS_UP:'SRCS',ercs:'srcs',ERC:'SRC',erc:'src',
              U:'Sila',u:'sila',UU:'SILA',Ether:'Sila',ether:'sila',ETH:'SIL',Eth:'Sil',eth:'sil',
              Mainnet:'SilaMainnet',mainnet:'sila-mainnet',MAINNET:'SILA_MAINNET',
              Sepolia:'SilaSepolia',Holesky:'SilaHolesky',Deneb:'SilaDeneb',Fulu:'SilaFulu',PeerDAS:'SilaPeerDAS',
              Cancun:'SilaCancun',Shanghai:'SilaShanghai',Prague:'SilaPrague',Osaka:'SilaOsaka',Paris:'SilaParis',
              Amsterdam:'SilaAmsterdam',Kovan:'SilaKovan'
          }
          token_rx=re.compile(r'\b(?:'+'|'.join(sorted(map(re.escape,token_map),key=len,reverse=True))+r')\b')
          path_token_rx=re.compile(r'(?<![A-Za-z0-9])(?:'+'|'.join(sorted(map(re.escape,token_map),key=len,reverse=True))+r')(?![A-Za-z0-9])')

          def convert_text(s):
              for a,b in literals:s=s.replace(a,b)
              return token_rx.sub(lambda m:token_map[m.group(0)],s)

          for p in list(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or '_upstream' in p.parts or '_sila_binary_preserve' in p.parts or is_binary(p):continue
              try:s=p.read_text('utf-8')
              except UnicodeDecodeError:continue
              n=convert_text(s)
              if n!=s:p.write_text(n,'utf-8')

          def rename_component(name):
              exact={u+'_vocab.yaml':'sila_vocab.yaml',eth+'-protocol-transcripts':'sila-protocol-transcripts'}
              n=exact.get(name,name)
              n=n.replace(Eth+'Magicians','SilaMagicians')
              n=path_token_rx.sub(lambda m:token_map[m.group(0)],n)
              n=re.sub(r'^'+re.escape(Eth)+r'(?=[A-Z])','Sil',n)
              n=re.sub(r'^'+re.escape(ETH)+r'(?=[-_A-Z0-9])','SIL',n)
              return n

          for p in sorted([x for x in root.rglob('*') if '.git' not in x.parts and '_upstream' not in x.parts and '_sila_binary_preserve' not in x.parts],key=lambda x:len(x.parts),reverse=True):
              if not p.exists():continue
              nn=rename_component(p.name)
              if nn!=p.name:
                  q=p.with_name(nn)
                  if q.exists():raise SystemExit(f'PATH_COLLISION:{p}->{q}')
                  p.rename(q)

          shutil.rmtree(upstream);shutil.rmtree(preserve)

          identity_tokens=[U,u,UU,EIPS,eips,EIP,eip,ERCS,ERCS_UP,ercs,ERC,erc,ETH,Eth,eth,Ether,ether]
          residual_rx=re.compile(
              r'\b(?:'+'|'.join(map(re.escape,identity_tokens))+r')\b|'+
              re.escape('github.com/'+u)+'|'+re.escape(eips+'.'+u+'.org')+'|'+re.escape(u+'.org')
          )
          residual=[]
          for p in root.rglob('*'):
              if '.git' in p.parts or not p.is_file():continue
              rel=p.relative_to(root).as_posix()
              if residual_rx.search(rel):residual.append('PATH:'+rel)
              if is_binary(p):continue
              try:s=p.read_text('utf-8')
              except UnicodeDecodeError:continue
              if residual_rx.search(s):residual.append('TEXT:'+rel)
          print('ACTIONABLE_IDENTITY_RESIDUAL_COUNT='+str(len(residual)))
          if residual:
              print('\n'.join(residual[:300]));raise SystemExit(1)

          fork_network_sources=[Mainnet,MAINNET,Sepolia,Holesky,Deneb,Fulu,PeerDAS,Cancun,Shanghai,Prague,Osaka,Paris,Amsterdam,Kovan]
          path_residual=[]
          for p in root.rglob('*'):
              if '.git' in p.parts:continue
              rel=p.relative_to(root).as_posix()
              if re.search(r'(?<!sila-)\b'+re.escape(mainnet)+r'\b',rel):path_residual.append((rel,mainnet))
              for src in fork_network_sources:
                  if re.search(r'(?<![A-Za-z0-9])'+re.escape(src)+r'(?![A-Za-z0-9])',rel):path_residual.append((rel,src))
              if Eth+'Magicians' in rel:path_residual.append((rel,Eth+'Magicians'))
          dedup=[];seen=set()
          for item in path_residual:
              if item not in seen:seen.add(item);dedup.append(item)
          print('ACTIONABLE_PATH_RESIDUAL_COUNT='+str(len(dedup)))
          if dedup:
              for rel,src in dedup[:300]:print(f'PATH_IDENTITY_RESIDUAL:{src}:{rel}')
              raise SystemExit(1)
          PY

          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows
          git config user.name 'SILA Network'
          git config user.email 'sila-chain@users.noreply.github.com'
          git add -A
          git commit -m 'sync: exact latest PM authority as pure Sila'
          git push origin HEAD:sila/pm-latest-pure-20260907
